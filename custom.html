<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom Print | JY 3D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background:#0d1117; color:white; font-family:sans-serif; padding:20px;">

<div style="max-width: 500px; margin: 40px auto; background:#161b22; padding:30px; border-radius:12px; border:1px solid #30363d;">
    <h2>Custom Print Brief</h2>
    <form id="custom-form">
        <label>Object Description</label>
        <textarea id="notes" placeholder="What should I print?" required style="width:100%; height:100px; margin:10px 0; background:#010409; color:white; border:1px solid #30363d;"></textarea>
        
        <label>Material/Color</label>
        <input type="text" id="color" placeholder="e.g. Matte Black" style="width:100%; padding:10px; margin:10px 0; background:#010409; color:white; border:1px solid #30363d;">

        <hr border="1" color="#30363d" style="margin:20px 0;">

        <input type="text" id="name" placeholder="Your Name" required style="width:100%; padding:10px; margin-bottom:10px; background:#010409; color:white; border:1px solid #30363d;">
        <input type="email" id="email" placeholder="Your Email" required style="width:100%; padding:10px; margin-bottom:20px; background:#010409; color:white; border:1px solid #30363d;">
        
        <button type="submit" style="width:100%; padding:15px; background:#58a6ff; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Submit Brief to Studio</button>
    </form>
</div>

<script type="module">
    import { db, collection, addDoc } from './firebase-config.js';

    document.getElementById('custom-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            await addDoc(collection(db, "orders"), {
                customerName: document.getElementById('name').value,
                customerEmail: document.getElementById('email').value,
                items: [{ 
                    name: "CUSTOM REQUEST", 
                    price: "TBD", 
                    color: document.getElementById('color').value 
                }],
                notes: document.getElementById('notes').value,
                status: "active",
                timestamp: new Date()
            });
            alert("Custom brief sent! Joshua will review it.");
            window.location.href = "index.html";
        } catch (err) {
            console.error(err);
        }
    });
</script>
</body>
</html>
