<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometric Vase v1 | JY 3D Studio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .product-flex { 
            display: flex; 
            gap: 40px; 
            max-width: 1000px; 
            margin: 40px auto; 
            padding: 20px; 
            align-items: flex-start;
        }
        .product-image { 
            flex: 1; 
            background: #161b22; 
            border-radius: 12px; 
            aspect-ratio: 1/1; 
            border: 1px solid #30363d;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .product-options { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        
        label { font-size: 0.85rem; color: #8b949e; margin-bottom: -5px; margin-top: 10px;}
        
        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            background: #0d1117; 
            border: 1px solid #30363d; 
            color: white; 
            border-radius: 6px; 
            font-family: inherit;
            box-sizing: border-box;
        }

        .size-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .size-field { flex: 1; position: relative; }
        .unit-label { 
            position: absolute; 
            right: 12px; 
            top: 50%; 
            transform: translateY(-50%); 
            color: #484f58; 
            font-size: 0.8rem;
            pointer-events: none;
        }

        .price-tag { font-size: 2.5rem; color: #58a6ff; font-weight: bold; margin: 10px 0; }
        
        .surcharge-warning { 
            background: rgba(255, 171, 0, 0.1); 
            color: #ffab00; 
            padding: 12px; 
            border-radius: 6px; 
            font-size: 0.85rem; 
            border: 1px solid #ffab00;
            display: none;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<nav>
    <div class="logo">JY 3D STUDIO</div>
    <div class="nav-links">
        <a href="index.html">Collection</a>
        <a href="custom.html">Custom Design</a>
    </div>
</nav>

<div class="product-flex">
    <div class="product-image">
        <span style="color:#444;">[ STL Render Placeholder ]</span>
    </div>

    <div class="product-options">
        <h1>Geometric Vase v1</h1>
        <div class="price-tag" id="item-total">$15.00</div>
        
        <label>Select Color</label>
        <select id="item-color">
            <option value="Dark Blue">Dark Blue</option>
            <option value="Deep Purple">Deep Purple</option>
            <option value="Forest Green">Forest Green</option>
            <option value="Yellow">Yellow</option>
            <option value="Orange">Orange</option>
            <option value="White">White (Limited Stock)</option>
        </select>

        <label>Target Size (linked units for precision)</label>
        <div class="size-input-group">
            <div class="size-field">
                <input type="number" id="input-inches" step="0.1" value="3.1" oninput="convertSize('in')">
                <span class="unit-label">in</span>
            </div>
            <div style="color:#444;">=</div>
            <div class="size-field">
                <input type="number" id="input-mm" step="1" value="80" oninput="convertSize('mm')">
                <span class="unit-label">mm</span>
            </div>
        </div>
        
        <div id="size-warning" class="surcharge-warning">
            ⚠️ <strong>Multi-Part Assembly:</strong> Since this exceeds 100mm (approx 4"), it requires printing in sections. A $10 assembly fee is included.
        </div>

        <label>Personalization & Tweaks (Notes)</label>
        <textarea id="item-notes" rows="4" placeholder="Ex: Add name 'Alex' to base, or make the walls thicker..."></textarea>

        <button class="buy-btn" onclick="addItemToOrder()">Add to Order Slip</button>
    </div>
</div>

<script>
    function convertSize(unit) {
        const inchInput = document.getElementById('input-inches');
        const mmInput = document.getElementById('input-mm');
        const warning = document.getElementById('size-warning');
        const priceDisplay = document.getElementById('item-total');

        let mmValue;

        if (unit === 'in') {
            mmValue = Math.round(inchInput.value / 0.0393701);
            mmInput.value = mmValue;
        } else {
            mmValue = mmInput.value;
            inchInput.value = (mmValue * 0.0393701).toFixed(1);
        }

        let finalPrice = 15;
        if (mmValue > 100) {
            finalPrice += 10;
            warning.style.display = 'block';
        } else {
            warning.style.display = 'none';
        }

        priceDisplay.innerText = `$${finalPrice}.00`;
    }

    function addItemToOrder() {
        let cart = JSON.parse(localStorage.getItem('jy_cart')) || [];
        
        const sizeString = document.getElementById('input-mm').value + "mm (" + 
                           document.getElementById('input-inches').value + "in)";

        const newItem = {
            name: "Geometric Vase v1",
            color: document.getElementById('item-color').value,
            size: sizeString,
            notes: document.getElementById('item-notes').value || "No tweaks",
            price: document.getElementById('item-total').innerText
        };

        cart.push(newItem);
        localStorage.setItem('jy_cart', JSON.stringify(cart));
        
        alert("Added to your order! Redirecting to shop...");
        window.location.href = 'index.html';
    }

    // Initialize display on load
    window.onload = function() { convertSize('mm'); };
</script>

</body>
</html>
