<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometric Vase v1 | JY 3D Studio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .product-flex { 
            display: flex; 
            gap: 40px; 
            max-width: 1000px; 
            margin: 40px auto; 
            padding: 20px; 
            align-items: flex-start;
        }
        .product-image { 
            flex: 1; 
            background: #161b22; 
            border-radius: 12px; 
            aspect-ratio: 1/1; 
            border: 1px solid #30363d;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .product-options { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        
        label { font-size: 0.85rem; color: #8b949e; margin-bottom: -10px; }
        
        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            background: #0d1117; 
            border: 1px solid #30363d; 
            color: white; 
            border-radius: 6px; 
            font-family: inherit;
        }

        .price-tag { font-size: 2.5rem; color: #58a6ff; font-weight: bold; margin: 10px 0; }
        
        .surcharge-warning { 
            background: rgba(255, 171, 0, 0.1); 
            color: #ffab00; 
            padding: 12px; 
            border-radius: 6px; 
            font-size: 0.85rem; 
            border: 1px solid #ffab00;
            display: none;
        }
    </style>
</head>
<body>

<nav>
    <div class="logo">JY 3D STUDIO</div>
    <div class="nav-links"><a href="index.html">Collection</a></div>
</nav>

<div class="product-flex">
    <div class="product-image">
        <span style="color:#444;">[ STL Render Placeholder ]</span>
    </div>

    <div class="product-options">
        <h1>Geometric Vase v1</h1>
        <div class="price-tag" id="item-total">$15.00</div>
        
        <label>Select Color</label>
        <select id="item-color">
            <option>Dark Blue</option>
            <option>Deep Purple</option>
            <option>Forest Green</option>
            <option>Yellow</option>
            <option>Orange</option>
            <option value="White">White (Limited Stock)</option>
        </select>

        <label>Target Size (Width/Height in mm)</label>
        <input type="number" id="size-input" value="80" oninput="calcItemPrice()">
        
        <div id="size-warning" class="surcharge-warning">
            ⚠️ <strong>Multi-Part Assembly:</strong> Sizes over 100mm require manual assembly. A $10 fee has been added.
        </div>

        <label>Personalization & Tweaks (Notes)</label>
        <textarea id="item-notes" rows="4" placeholder="Ex: Add name 'Alex' to base, or make the walls 2mm thicker..."></textarea>

        <button class="buy-btn" onclick="addItemToOrder()">Add to Order Slip</button>
    </div>
</div>

<script>
    function calcItemPrice() {
        let price = 15;
        const size = document.getElementById('size-input').value;
        const warning = document.getElementById('size-warning');
        const display = document.getElementById('item-total');

        if (size > 100) {
            price += 10;
            warning.style.display = 'block';
        } else {
            warning.style.display = 'none';
        }

        display.innerText = `$${price}.00`;
    }

    function addItemToOrder() {
        let cart = JSON.parse(localStorage.getItem('jy_cart')) || [];
        const item = {
            name: "Geometric Vase v1",
            color: document.getElementById('item-color').value,
            size: document.getElementById('size-input').value + "mm",
            notes: document.getElementById('item-notes').value || "No tweaks",
            price: document.getElementById('item-total').innerText
        };
        cart.push(item);
        localStorage.setItem('jy_cart', JSON.stringify(cart));
        alert("Added to your order! Redirecting to shop...");
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
