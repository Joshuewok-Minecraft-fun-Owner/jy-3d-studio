<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Production Pipeline | JY 3D</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; padding: 20px; border-radius: 10px; }
        .item-tag { background: #0d1117; padding: 5px 10px; border-radius: 4px; display: block; margin-top: 5px; font-size: 0.9rem; border: 1px solid #21262d; }
        .done-btn { width: 100%; margin-top: 20px; padding: 10px; background: #238636; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body style="background:#0d1117; color:white; font-family:sans-serif;">

<div style="max-width: 1200px; margin: auto; padding: 40px 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Active Production Pipeline</h1>
        <span style="color: #3fb950; font-size: 0.8rem;">● LIVE SYNC ACTIVE</span>
    </div>
    <div id="order-grid" class="grid">Loading jobs...</div>
</div>

<script type="module">
    import { db, collection, onSnapshot, query, where, orderBy, updateDoc, doc } from './firebase-config.js';

    const grid = document.getElementById('order-grid');
    
    // Only fetch orders where status is "active"
    const q = query(collection(db, "orders"), where("status", "==", "active"), orderBy("timestamp", "desc"));

    onSnapshot(q, (snapshot) => {
        grid.innerHTML = '';
        if(snapshot.empty) {
            grid.innerHTML = "<p style='color:#8b949e;'>Pipeline is empty. Ready for new orders.</p>";
            return;
        }

        snapshot.forEach((orderDoc) => {
            const data = orderDoc.data();
            const id = orderDoc.id;
            const items = data.items.map(i => `<span class="item-tag">${i.name}</span>`).join('');

            grid.innerHTML += `
                <div class="card">
                    <h3 style="margin:0">${data.customerName}</h3>
                    <p style="color:#58a6ff; font-size:0.8rem; margin-top:5px;">${data.customerEmail}</p>
                    <div style="margin-top:15px;">${items}</div>
                    <button class="done-btn" onclick="archiveOrder('${id}')">Mark as Completed</button>
                </div>
            `;
        });
    });

    window.archiveOrder = async (id) => {
        if(confirm("Mark this job as completed?")) {
            await updateDoc(doc(db, "orders", id), { status: "completed" });
        }
    };
</script>
</body>
</html>
