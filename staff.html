<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Production | JY 3D Studio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --accent: #58a6ff; }
        body { background: var(--bg); color: white; font-family: sans-serif; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .import-section { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 10px; margin-bottom: 30px; }
        textarea { width: 100%; height: 80px; background: #010409; color: #8b949e; border: 1px solid var(--border); padding: 10px; border-radius: 6px; margin-bottom: 10px; font-family: monospace; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 10px; position: relative; }
        
        .status-btn { background: #21262d; border: 1px solid var(--border); color: #c9d1d9; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; margin-right: 5px; }
        .status-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        
        .price-tag { font-weight: bold; color: var(--accent); font-size: 1.2rem; }
        .detail-row { margin: 10px 0; font-size: 0.9rem; border-bottom: 1px solid #21262d; padding-bottom: 5px; }
        .label { color: #8b949e; font-size: 0.7rem; text-transform: uppercase; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h1>JY Production Dashboard</h1>
    
    <div class="import-section">
        <label class="label">Paste Work Order from Email</label>
        <textarea id="raw-input" placeholder="Paste the text from Formspree here..."></textarea>
        <button class="buy-btn" onclick="processOrder()">+ Load into Pipeline</button>
    </div>

    <div class="grid" id="order-grid"></div>
</div>

<script>
    let pipeline = JSON.parse(localStorage.getItem('jy_pipeline')) || [];

    function processOrder() {
        const text = document.getElementById('raw-input').value;
        if (!text) return;

        // Extracting data from your email format
        const entry = {
            id: Date.now(),
            name: text.match(/PRODUCT: (.*)/)?.[1] || "Unnamed Item",
            specs: text.match(/COLOR: (.*)/)?.[1] + " | " + text.match(/SIZE: (.*)/)?.[1],
            notes: text.match(/NOTES: (.*)/)?.[1] || "No notes",
            price: text.match(/PRICE: (.*)/)?.[1] || "$0.00",
            status: "Pending"
        };

        pipeline.push(entry);
        save();
        document.getElementById('raw-input').value = '';
        render();
    }

    function render() {
        const grid = document.getElementById('order-grid');
        grid.innerHTML = '';
        
        pipeline.forEach((order, index) => {
            grid.innerHTML += `
                <div class="card">
                    <h3 style="margin-top:0">${order.name}</h3>
                    <div class="detail-row"><span class="label">Specs</span> ${order.specs}</div>
                    <div class="detail-row"><span class="label">Instructions</span> ${order.notes}</div>
                    <div class="detail-row"><span class="label">Payment Due</span> <span class="price-tag">${order.price}</span></div>
                    
                    <div style="margin-top:15px;">
                        <button class="status-btn ${order.status === 'Pending' ? 'active' : ''}" onclick="updateStatus(${index}, 'Pending')">Pending</button>
                        <button class="status-btn ${order.status === 'Printing' ? 'active' : ''}" onclick="updateStatus(${index}, 'Printing')">Printing</button>
                        <button class="status-btn" onclick="archive(${index})" style="float:right; border-color:#f85149; color:#f85149;">Done/Archive</button>
                    </div>
                </div>
            `;
        });
    }

    function updateStatus(index, s) { pipeline[index].status = s; save(); render(); }
    function archive(index) { pipeline.splice(index, 1); save(); render(); }
    function save() { localStorage.setItem('jy_pipeline', JSON.stringify(pipeline)); }

    window.onload = render;
</script>

</body>
</html>
