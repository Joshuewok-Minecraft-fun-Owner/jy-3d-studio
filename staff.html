<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pipeline | JY 3D Staff</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background:#0d1117; color:white; padding:40px;">
    <h1 style="border-bottom:1px solid #30363d; padding-bottom:10px;">Production Pipeline</h1>
    <div id="staff-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:20px; margin-top:20px;"></div>

    <script type="module">
        import { db, collection, onSnapshot, query, where, updateDoc, doc } from './firebase-config.js';
        const q = query(collection(db, "orders"), where("status", "==", "active"));
        
        onSnapshot(q, (snap) => {
            const grid = document.getElementById('staff-grid');
            grid.innerHTML = '';
            snap.forEach(d => {
                const data = d.data();
                const card = document.createElement('div');
                card.style = "background:#161b22; border:1px solid #30363d; padding:20px; border-radius:8px;";
                card.innerHTML = `
                    <h3>${data.customerName}</h3>
                    <p>${data.customerEmail}</p>
                    <a href="${data.stlUrl}" target="_blank" style="color:#58a6ff;">Download Geometry</a>
                    <button onclick="finish('${d.id}')" style="width:100%; margin-top:15px; padding:10px; background:#238636; color:white; border:none; border-radius:5px; cursor:pointer;">Mark Complete</button>
                `;
                grid.appendChild(card);
            });
        });

        window.finish = async (id) => {
            await updateDoc(doc(db, "orders", id), { status: "completed" });
        };
    </script>
</body>
</html>
