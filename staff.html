<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Pipeline</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background:#0d1117; color:white; font-family:sans-serif; padding:40px;">

    <h1>Active Production Pipeline</h1>
    <div id="grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:20px;">
        Loading orders...
    </div>

<script type="module">
    import { db, collection, onSnapshot, query, where, orderBy, updateDoc, doc } from './firebase-config.js';

    const grid = document.getElementById('grid');

    // Listen for ACTIVE orders
    const q = query(collection(db, "orders"), where("status", "==", "active"), orderBy("timestamp", "desc"));

    onSnapshot(q, (snapshot) => {
        grid.innerHTML = '';
        if (snapshot.empty) {
            grid.innerHTML = "No active orders.";
            return;
        }

        snapshot.forEach((orderDoc) => {
            const data = orderDoc.data();
            const id = orderDoc.id;
            const items = data.items.map(i => `<li>${i.name}</li>`).join('');

            grid.innerHTML += `
                <div style="background:#161b22; border:1px solid #30363d; padding:20px; border-radius:10px;">
                    <h3>${data.customerName}</h3>
                    <p>${data.customerEmail}</p>
                    <ul>${items}</ul>
                    <button onclick="window.markDone('${id}')" style="background:#238636; color:white; border:none; padding:10px; width:100%; cursor:pointer; border-radius:4px;">Mark Completed</button>
                </div>
            `;
        });
    });

    window.markDone = async (id) => {
        await updateDoc(doc(db, "orders", id), { status: "completed" });
    };
</script>
</body>
</html>
