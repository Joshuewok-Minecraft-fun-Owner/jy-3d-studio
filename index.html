<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JY 3D Design Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <div class="cart-icon" onclick="goToCheckout()" style="cursor:pointer; position:relative;">
        🛒 Slip (<span id="cart-count">0</span>)
    </div>
    
    <button class="buy-btn" onclick="addToCart('Geometric Vase', '$25.00')">Add to Slip</button>
    
    <script src="main.js"></script>
</nav>

<header class="hero">
    <h1>Original Geometry. Digital Craft.</h1>
    <p>Premium STL designs and FDM prints in Regular PLA.</p>
</header>

<section class="grid">
    <div class="card">
        <div class="img-placeholder">IMAGE COMING SOON</div>
        <div class="card-info">
            <h3>Geometric Planter v1</h3>
            <p class="price">$15.00</p>
            <button class="buy-btn">Add to Order</button>
        </div>
    </div>

    <div class="card custom-card">
        <div class="img-placeholder" style="border: 1px dashed #444;">YOUR ART HERE</div>
        <div class="card-info">
            <h3>Custom Commission</h3>
            <p class="price">From $25.00</p>
            <a href="custom.html" class="buy-btn" style="text-align: center; text-decoration: none; display: block;">Design Now</a>
        </div>
    </div>
</section>

<footer>
    <p>Standard PLA | Max Build: 100x120x100mm | Hand-crafted by Joshua</p>
</footer>

</body>
</html>
