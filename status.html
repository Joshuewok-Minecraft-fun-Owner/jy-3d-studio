<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Print Status | JY 3D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav style="display: flex; align-items: center; justify-content: space-between; padding: 15px 30px; background: #161b22; border-bottom: 1px solid #30363d;">
        <a href="index.html" style="text-decoration: none; display: flex; align-items: center;">
            <img src="https://i.postimg.cc/SRM77fTp/JY_3D_Studio_Logo.png" alt="Logo" style="height: 40px; margin-right: 12px;">
            <span style="color: white; font-weight: bold; font-size: 1.2rem;">JY 3D <span style="color: #58a6ff;">STUDIO</span></span>
        </a>
        <div style="display: flex; align-items: center; gap: 20px;">
            <a href="index.html" style="color: #c9d1d9; text-decoration: none;">Collection</a>
            <a href="custom.html" style="color: #c9d1d9; text-decoration: none;">Custom Request</a>
            <a href="checkout.html" style="color: #c9d1d9; text-decoration: none; position: relative;">
                Cart
                <span id="cart-count" style="position: absolute; top: -8px; right: -15px; background: #58a6ff; color: white; border-radius: 50%; padding: 2px 6px; font-size: 0.7rem; font-weight: bold;">0</span>
            </a>
        </div>
    </nav>

    <div style="background:#0d1117; color:white; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:calc(100vh - 70px);">
        <div style="background:#161b22; border:1px solid #30363d; padding:40px; border-radius:12px; text-align:center; width:90%; max-width:400px;">
            <img src="https://i.postimg.cc/SRM77fTp/JY_3D_Studio_Logo.png" style="height:50px; margin-bottom:20px;">
            <h2 id="cust-name">Locating Order...</h2>
            <div id="badge" style="padding:10px 20px; border-radius:20px; font-weight:bold; display:inline-block; margin:20px 0;">--</div>
            <p id="msg" style="color:#8b949e;"></p>
            <p style="font-size:10px; color:#30363d; margin-top:20px;">ID: <span id="ord-id"></span></p>
        </div>
    </div>

    <script type="module">
        import { db, doc, onSnapshot } from './firebase-config.js';
        const id = new URLSearchParams(window.location.search).get('id');
        if(id) {
            document.getElementById('ord-id').innerText = id;
            onSnapshot(doc(db, "orders", id), (s) => {
                if(s.exists()){
                    const d = s.data();
                    document.getElementById('cust-name').innerText = `Hi, ${d.customerName}`;
                    const b = document.getElementById('badge');
                    const msg = document.getElementById('msg');
                    
                    if (d.status === 'active') {
                        b.innerText = "Order Received";
                        msg.innerText = "In Queue";
                        b.style.background = "rgba(88,166,255,0.1)";
                        b.style.color = "#58a6ff";
                    } else if (d.status === 'printing') {
                        b.innerText = "In Production";
                        msg.innerText = "On Build Plate";
                        b.style.background = "rgba(255, 193, 7, 0.1)";
                        b.style.color = "#ffc107";
                    } else if (d.status === 'completed') {
                        b.innerText = "Print Finished";
                        msg.innerText = "Success! Your print is complete.";
                        b.style.background = "rgba(56,232,120,0.1)";
                        b.style.color = "#3fb950";
                    }
                }
            });
        }
    </script>
</body>
</html>
