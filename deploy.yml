name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Generate Firebase config from secret
        run: |
          mkdir -p js
          cat > js/firebase-config.js << 'EOF'
          // Auto-generated from GitHub Secrets - DO NOT EDIT MANUALLY
          // Update FIREBASE_CONFIG secret in: Settings > Secrets and variables > Actions
          import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
          import { 
              getFirestore, 
              collection, 
              addDoc, 
              onSnapshot, 
              query, 
              where, 
              orderBy, 
              updateDoc, 
              doc,
              deleteDoc,
              getDoc
          } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
          
          const firebaseConfig = ${{ secrets.FIREBASE_CONFIG }};
          
          const app = initializeApp(firebaseConfig);
          const db = getFirestore(app);
          
          export { db, collection, addDoc, onSnapshot, query, where, orderBy, updateDoc, doc, getDoc, deleteDoc };
          EOF
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
