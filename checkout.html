<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | JY 3D Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <div class="logo">JY 3D STUDIO</div>
    <div class="nav-links"><a href="index.html">Back to Shop</a></div>
</nav>

<div style="max-width: 600px; margin: 50px auto; padding: 30px; background: #0d1117; border-radius: 12px; border: 1px solid #30363d;">
    <h2>Finalize Your Order Slip</h2>
    <p style="color: #8b949e; margin-bottom: 25px;">Submit your details below. I will review the design and email you with payment instructions.</p>

    <form id="checkout-form">
        <label style="display:block; color:#8b949e; font-size:0.9rem;">Full Name</label>
        <input type="text" id="cust-name" required style="width:100%; padding:12px; margin:8px 0 20px 0; background:#010409; border:1px solid #30363d; color:white; border-radius:6px;">

        <label style="display:block; color:#8b949e; font-size:0.9rem;">Email Address</label>
        <input type="email" id="cust-email" required style="width:100%; padding:12px; margin:8px 0 20px 0; background:#010409; border:1px solid #30363d; color:white; border-radius:6px;">

        <div id="order-summary" style="background:#161b22; padding:15px; border-radius:8px; margin-bottom:25px; border:1px solid #30363d;">
            </div>

        <button type="submit" class="buy-btn" style="width:100%; padding:15px; font-size:1.1rem;">Submit Order to Studio</button>
    </form>
</div>

<script type="module">
    import { db, collection, addDoc } from './firebase-config.js';

    // 1. Load Summary
    const cart = JSON.parse(localStorage.getItem('jy_cart')) || [];
    const summary = document.getElementById('order-summary');
    let total = 0;

    if(cart.length === 0) {
        summary.innerHTML = "Your slip is empty.";
    } else {
        cart.forEach(item => {
            summary.innerHTML += `<div style="display:flex; justify-content:between; margin-bottom:10px; font-size:0.9rem;">
                <span style="flex:1;">${item.name}</span>
                <span style="color:#58a6ff;">${item.price}</span>
            </div>`;
            total += parseFloat(item.price.replace('$', ''));
        });
        summary.innerHTML += `<div style="border-top:1px solid #30363d; margin-top:10px; padding-top:10px; font-weight:bold; display:flex; justify-content:space-between;">
            <span>Estimated Total:</span>
            <span>$${total.toFixed(2)}</span>
        </div>`;
    }

    // 2. Handle Firebase Submission
    document.getElementById('checkout-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = e.target.querySelector('button');
        btn.innerText = "Syncing with Studio...";
        btn.disabled = true;

        try {
            await addDoc(collection(db, "orders"), {
                customerName: document.getElementById('cust-name').value,
                customerEmail: document.getElementById('cust-email').value,
                items: cart,
                totalPrice: `$${total.toFixed(2)}`,
                status: "active", // Required for filtering
                timestamp: new Date()
            });

            alert("Success! Your order is in the pipeline. I'll email you shortly.");
            localStorage.removeItem('jy_cart');
            window.location.href = "index.html";
        } catch (err) {
            alert("Error: " + err.message);
            btn.innerText = "Submit Order to Studio";
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
