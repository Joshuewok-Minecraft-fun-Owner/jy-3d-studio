<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout | JY 3D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background:#0d1117; color:white; font-family:sans-serif;">

<div style="max-width: 500px; margin: 50px auto; padding: 20px; border: 1px solid #30363d; border-radius: 12px;">
    <h2>Your Order Slip</h2>
    <div id="cart-items" style="margin-bottom: 20px;"></div>
    
    <hr border="1" color="#30363d">
    
    <form id="order-form" style="margin-top:20px;">
        <input type="text" id="name" placeholder="Your Name" required style="width:100%; padding:10px; margin-bottom:10px; background:#010409; color:white; border:1px solid #30363d;">
        <input type="email" id="email" placeholder="Your Email" required style="width:100%; padding:10px; margin-bottom:20px; background:#010409; color:white; border:1px solid #30363d;">
        <button type="submit" style="width:100%; padding:15px; background:#58a6ff; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">Submit Order to Studio</button>
    </form>
</div>

<script type="module">
    import { db, collection, addDoc } from './firebase-config.js';

    const cart = JSON.parse(localStorage.getItem('jy_cart')) || [];
    const container = document.getElementById('cart-items');

    // Display items
    if(cart.length === 0) {
        container.innerHTML = "Your slip is empty.";
    } else {
        cart.forEach(item => {
            container.innerHTML += `<div style="display:flex; justify-content:space-between; margin:10px 0;">
                <span>${item.name}</span><span>${item.price}</span>
            </div>`;
        });
    }

    // Submit to Firebase
    document.getElementById('order-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        try {
            await addDoc(collection(db, "orders"), {
                customerName: document.getElementById('name').value,
                customerEmail: document.getElementById('email').value,
                items: cart,
                status: "active",
                timestamp: new Date()
            });

            alert("Order Sent! Check your email soon.");
            localStorage.removeItem('jy_cart');
            window.location.href = "index.html";
        } catch (err) {
            console.error(err);
            alert("Error syncing with database. Check console.");
        }
    });
</script>
</body>
</html>
